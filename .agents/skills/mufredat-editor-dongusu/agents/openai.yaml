interface:
  display_name: "Müfredat Editör Döngüsü"
  short_description: "Doğru, doyurucu ve gençlere hitap eden dersleri olgunlaştır"
  default_prompt: "$mufredat-editor-dongusu ile bu müfredat metninin kaynak doğruluğunu, bilgi doyuruculuğunu, gençlere uygun dilini ve anlatısını ayrı kanıtlarla incele; gerekli düzeltmeleri yapıp yeniden değerlendir."
