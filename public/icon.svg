<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Matte Obsidian Canvas Gradient -->
    <linearGradient id="logoBg" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12151c"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>

    <!-- Subtle Matte Precision Hairline Border -->
    <linearGradient id="logoBorder" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Supersonic Delta Wing - Titanium Light (Left) -->
    <linearGradient id="jetLeft" x1="170" y1="84" x2="252" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Supersonic Delta Wing - Titanium Shadow (Right) -->
    <linearGradient id="jetRight" x1="342" y1="84" x2="260" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Academic Mortarboard Crest - Matte Bordeaux Light (Left) -->
    <linearGradient id="acadLeft" x1="170" y1="216" x2="252" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="60%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>

    <!-- Academic Mortarboard Crest - Matte Bordeaux Deep (Right) -->
    <linearGradient id="acadRight" x1="342" y1="216" x2="260" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="60%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#2c030e"/>
    </linearGradient>

    <!-- Soft Ambient Matte Aura -->
    <radialGradient id="ambientGlow" cx="256" cy="256" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9f1239" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#9f1239" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Matte Obsidian Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#logoBg)"/>
  <rect width="512" height="512" rx="116" fill="url(#ambientGlow)"/>
  <rect x="1" y="1" width="510" height="510" rx="115" stroke="url(#logoBorder)" stroke-width="1.5"/>

  <!-- Unified Supersonic Jet & Academic Mortarboard Mark -->
  <g id="jetMark" transform="translate(0, 10)">
    <!-- 1. JET: Aerodynamic Mach Delta Wings (Supersonic Titanium Facets) -->
    <path d="M 252,80 L 96,252 L 252,198 Z" fill="url(#jetLeft)"/>
    <path d="M 260,80 L 416,252 L 260,198 Z" fill="url(#jetRight)"/>

    <!-- 2. ACADEMIE: Foundation Mortarboard Diamond / Knowledge Crest (Matte Bordeaux) -->
    <path d="M 252,224 L 116,274 L 252,410 Z" fill="url(#acadLeft)"/>
    <path d="M 260,224 L 396,274 L 260,410 Z" fill="url(#acadRight)"/>

    <!-- 3. Leading Edge Sheen (Matte Precision Refraction Lines) -->
    <line x1="252" y1="80" x2="96" y2="252" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round"/>
    <line x1="260" y1="80" x2="416" y2="252" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35" stroke-linecap="round"/>
  </g>
</svg>