<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: Deep Space Obsidian with Navy Undertone -->
    <linearGradient id="logoBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080c1d"/>
      <stop offset="50%" stop-color="#0e132c"/>
      <stop offset="100%" stop-color="#151134"/>
    </linearGradient>

    <!-- Radial Core Speed Glow -->
    <radialGradient id="logoGlow" cx="256" cy="240" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Left Mortarboard Wing: Electric Sky to Royal Indigo -->
    <linearGradient id="capLeft" x1="72" y1="120" x2="246" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <!-- Right Mortarboard Wing: Royal Indigo to Deep Violet -->
    <linearGradient id="capRight" x1="266" y1="120" x2="440" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>

    <!-- Central Ascending Supersonic Jet Interceptor: Pure White to Speed Cyan to Indigo -->
    <linearGradient id="jetCore" x1="256" y1="52" x2="256" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0f2fe"/>
      <stop offset="65%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Academic Foundation & Sonic Mach Chevron: 24k Prestige Gold -->
    <linearGradient id="tasselGold" x1="160" y1="330" x2="352" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Ambient Aerospace Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="116" fill="url(#logoBg)"/>
  <rect width="512" height="512" rx="116" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>
  <circle cx="256" cy="240" r="230" fill="url(#logoGlow)"/>

  <g filter="url(#logoShadow)">
    <!-- 1. Lower Mach Chevron in Academic 24k Gold (Open Knowledge Crest & Afterburner Flare) -->
    <path d="M 164,342 L 256,396 L 348,342 L 328,318 L 256,360 L 184,318 Z" fill="url(#tasselGold)"/>

    <!-- 2. Left Delta Mortarboard Wing (Aerodynamic Speed Facet) -->
    <path d="M 240,110 L 72,228 L 240,320 Z" fill="url(#capLeft)"/>

    <!-- 3. Right Delta Mortarboard Wing (Deep Aerospace Facet) -->
    <path d="M 272,110 L 440,228 L 272,320 Z" fill="url(#capRight)"/>

    <!-- 4. Center Hero: Ascending Supersonic Jet Interceptor (Forward Thrust Needle) -->
    <path d="M 256,52 L 278,146 L 306,204 L 270,200 L 256,310 L 242,200 L 206,204 L 234,146 Z" fill="url(#jetCore)"/>
  </g>
</svg>