<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="45%" stop-color="#0d1127"/>
      <stop offset="100%" stop-color="#181338"/>
    </linearGradient>

    <!-- Supersonic Jet Nosecone Flare (Smooth Radial) -->
    <radialGradient id="noseFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <!-- Jet Dart Facets (Speed & Tech) -->
    <linearGradient id="jetNoseLeft" x1="256" y1="40" x2="220" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="jetNoseRight" x1="256" y1="40" x2="292" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Academic Cap Diamond (Mortarboard Delta Wings) -->
    <linearGradient id="capWingLeft" x1="72" y1="160" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="capWingRight" x1="440" y1="160" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Under-Cap Academic Band -->
    <linearGradient id="bandGrad" x1="204" y1="244" x2="308" y2="286" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Open Book Pages (Wings of Wisdom) -->
    <linearGradient id="bookPageLeft" x1="70" y1="280" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="55%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <linearGradient id="bookPageRight" x1="442" y1="280" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <!-- Thrust Stream / Knowledge Spine -->
    <linearGradient id="spineThrust" x1="256" y1="270" x2="256" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Academic Golden Tassel -->
    <linearGradient id="tasselGold" x1="256" y1="170" x2="380" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Orbital Ring Guides -->
  <circle cx="256" cy="256" r="198" stroke="rgba(99,102,241,0.14)" stroke-width="1.5" stroke-dasharray="6 10"/>
  <ellipse cx="256" cy="272" rx="216" ry="136" stroke="rgba(56,189,248,0.07)" stroke-width="1"/>

  <g filter="url(#shadow)" transform="translate(0, 4)">
    <!-- 1. BASE: THE OPEN BOOK OF KNOWLEDGE (AERODYNAMIC LOWER WINGS) -->
    <path d="M 256,334 C 188,290 120,298 64,338 C 96,296 182,270 254,302 Z" fill="url(#bookPageLeft)"/>
    <path d="M 256,334 C 324,290 392,298 448,338 C 416,296 330,270 258,302 Z" fill="url(#bookPageRight)"/>

    <!-- Secondary Lower Page Layer -->
    <path d="M 256,366 C 196,326 134,334 82,370 C 112,332 186,308 254,336 Z" fill="url(#bookPageLeft)" opacity="0.45"/>
    <path d="M 256,366 C 316,326 378,334 430,370 C 400,332 326,308 258,336 Z" fill="url(#bookPageRight)" opacity="0.45"/>

    <!-- Center Spine & Rocket Exhaust Plume -->
    <path d="M 252,304 L 256,442 L 260,304 Z" fill="url(#spineThrust)"/>

    <!-- 2. UNDER-CAP ACADEMIC BAND -->
    <path d="M 204,244 L 308,244 L 292,286 L 220,286 Z" fill="url(#bandGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <line x1="220" y1="265" x2="292" y2="265" stroke="#4338ca" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- 3. THE ACADEMIC GRADUATION CAP (MORTARBOARD DELTA PLANE) -->
    <path d="M 256,92 L 72,188 L 256,268 Z" fill="url(#capWingLeft)"/>
    <path d="M 256,92 L 440,188 L 256,268 Z" fill="url(#capWingRight)"/>
    <path d="M 256,92 L 256,268 L 268,262 L 256,92 Z" fill="#ffffff" opacity="0.2"/>

    <!-- 4. SUPERSONIC JET INTERCEPTOR (PIERCING THROUGH CAP TO STRATOSPHERE) -->
    <circle cx="256" cy="46" r="38" fill="url(#noseFlare)"/>
    <path d="M 256,42 L 256,152 L 222,180 L 256,134 Z" fill="url(#jetNoseLeft)"/>
    <path d="M 256,42 L 256,152 L 290,180 L 256,134 Z" fill="url(#jetNoseRight)"/>
    <path d="M 256,36 L 265,82 L 256,74 L 247,82 Z" fill="#ffffff"/>

    <!-- Stealth Wing Canards Connecting Jet Body to Cap Surface -->
    <path d="M 256,134 L 334,188 L 282,192 L 256,166 L 230,192 L 178,188 Z" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <path d="M 256,134 L 256,166 L 282,192 L 334,188 Z" fill="#6366f1"/>
    <path d="M 256,134 L 256,166 L 230,192 L 178,188 Z" fill="#38bdf8"/>

    <!-- 5. CENTER COCKPIT & BEACON OF KNOWLEDGE (CAP BUTTON) -->
    <circle cx="256" cy="170" r="28" fill="url(#coreFlare)"/>
    <circle cx="256" cy="170" r="14" fill="#ffffff"/>
    <circle cx="256" cy="170" r="8" fill="#4f46e5"/>
    <circle cx="254" cy="168" r="3" fill="#ffffff"/>

    <!-- 6. THE ACADEMIC TASSEL (GOLDEN FLIGHT TRAIL & DIPLOMA PEN-NIB) -->
    <path d="M 256,170 C 344,178 372,212 372,266 C 372,300 366,328 366,346" fill="none" stroke="url(#tasselGold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 366,340 L 376,374 L 366,368 L 356,374 Z" fill="#fbbf24"/>
    <circle cx="366" cy="342" r="4.5" fill="#fef08a"/>
    <line x1="366" y1="346" x2="366" y2="364" stroke="#78350f" stroke-width="1.4"/>

    <!-- Speed Sparks / Stars of Excellence -->
    <circle cx="256" cy="24" r="3" fill="#38bdf8"/>
    <circle cx="228" cy="48" r="2" fill="#818cf8"/>
    <circle cx="284" cy="48" r="2" fill="#c084fc"/>
  </g>
</svg>